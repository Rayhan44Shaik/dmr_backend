# Run from DMR-Poultries-ERP repo root:
#   docker compose up -d
#   npm run db:up
#
# Equivalent: docker compose -f backend/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: dmr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dmr
      POSTGRES_PASSWORD: dmr_local_dev
      POSTGRES_DB: dmr_poultries
    ports:
      - "5432:5432"
    volumes:
      - dmr_pg_data:/var/lib/postgresql/data
      - ./backend/sql/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./backend/sql/002_indexes.sql:/docker-entrypoint-initdb.d/002_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmr -d dmr_poultries"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dmr_pg_data:
